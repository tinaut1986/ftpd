name: Build Release

on:
  push:
    tags:
      - 'v*-EX*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide the tag and the channel once, so every job uses the same version label
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      channel: ${{ steps.vars.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag and channel
        id: vars
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              TAG=$(git describe --tags --always)
              ;;
          esac

          # Stable vs beta is decided by whether master can reach this commit,
          # NOT by "was this a tag push". A tag on an unmerged release/* branch
          # is a beta; only merging into master declares the line stable.
          # Push master BEFORE the tag, otherwise the tag build cannot see the
          # merge yet and publishes as a beta. If the fetch fails we fall
          # through to Beta (mislabelling stable as beta is recoverable).
          # To promote a shipped beta, re-run this workflow ON THE TAG.
          git fetch --no-tags --quiet origin +refs/heads/master:refs/remotes/origin/master || true
          if git merge-base --is-ancestor HEAD refs/remotes/origin/master 2>/dev/null; then
            PRERELEASE=false
            CHANNEL=Release
          else
            PRERELEASE=true
            CHANNEL=Beta
          fi
          {
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

  build-3ds:
    needs: meta
    runs-on: ubuntu-latest
    container:
      # Pinned, not :latest, so a toolchain update never changes a release by surprise.
      # Bump deliberately.
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq patch cmake > /dev/null
          dkp-pacman -S --needed --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib 3ds-jansson

      - name: Build and package (EX + classic)
        run: |
          chmod +x scripts/build-3ds.sh tools/bin/bannertool tools/bin/makerom
          scripts/build-3ds.sh "${{ needs.meta.outputs.tag }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-3ds
          path: dist/

  build-switch:
    needs: meta
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq patch cmake imagemagick zstd > /dev/null
          dkp-pacman -S --needed --noconfirm switch-dev switch-curl switch-libzstd switch-jansson switch-zlib switch-mbedtls switch-glm

      - name: Build and package (EX + classic)
        run: |
          chmod +x scripts/build-switch.sh
          scripts/build-switch.sh "${{ needs.meta.outputs.tag }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-switch
          path: dist/

  release:
    needs: [meta, build-3ds, build-switch]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Release notes: one QR per CIA (scan from FBI / a phone) plus a
      # changelog covering every commit since the previous tag.
      - name: Generate changelog and QR codes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode > /dev/null

          TAG="${{ needs.meta.outputs.tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PRERELEASE="${{ needs.meta.outputs.prerelease }}"

          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"

          qrencode -s 10 -o "dist/QR-ftpd-ex-${TAG}.png" "${BASE}/ftpd-ex-${TAG}.cia"
          qrencode -s 10 -o "dist/QR-ftpd-classic-${TAG}.png" "${BASE}/ftpd-classic-${TAG}.cia"

          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Beta build.** This comes off a branch that has not been merged"
              echo "> into \`master\` yet, so it is not a stable version."
              echo
            fi
            NOTES_FILE="docs/release-notes/${TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              echo "<!-- ftpd-notes -->"
              echo "## What's new"
              echo
              cat "$NOTES_FILE"
              echo
              echo "<!-- /ftpd-notes -->"
              echo
            fi
            echo "## Nintendo 3DS"
            echo
            echo "### ftpd-EX"
            echo
            echo "![QR code for ftpd-ex ${TAG}](${BASE}/QR-ftpd-ex-${TAG}.png)"
            echo
            echo "- [ftpd-ex-${TAG}.cia](${BASE}/ftpd-ex-${TAG}.cia)"
            echo "- [ftpd-ex-${TAG}.3dsx](${BASE}/ftpd-ex-${TAG}.3dsx)"
            echo
            echo "### ftpd-EX classic (text UI)"
            echo
            echo "![QR code for ftpd-classic ${TAG}](${BASE}/QR-ftpd-classic-${TAG}.png)"
            echo
            echo "- [ftpd-classic-${TAG}.cia](${BASE}/ftpd-classic-${TAG}.cia)"
            echo "- [ftpd-classic-${TAG}.3dsx](${BASE}/ftpd-classic-${TAG}.3dsx)"
            echo
            echo "## Nintendo Switch"
            echo
            echo "- [ftpd-ex-${TAG}.nro](${BASE}/ftpd-ex-${TAG}.nro)"
            echo "- [ftpd-classic-${TAG}.nro](${BASE}/ftpd-classic-${TAG}.nro) (text UI)"
            echo
            echo "Copy the \`.nro\` to \`/switch/\` on the SD card and launch it from the homebrew menu."
            echo
            echo "## Changelog"
            echo
            git log ${RANGE} --no-merges --pretty='- %s (%h)'
          } > release_notes.md

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.channel }} ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          body_path: release_notes.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
